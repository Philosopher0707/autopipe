name: ollama_cloud_demo
description: Pipeline using Ollama Cloud models

env:
  LOG_LEVEL: INFO

steps:
  # `sample_data_loader` loads a bundled scikit-learn dataset (iris|diabetes).
  - name: load_data
    type: sample_data_loader
    params:
      dataset: iris

  - name: analyze_with_cloud_llm
    type: llm
    depends_on: [load_data]
    params:
      provider: ollama
      # Uses OLLAMA_DEFAULT_MODEL from the environment.
      # No {placeholders} here: a template placeholder must name a run()
      # parameter this step actually receives, otherwise the raw template
      # would be sent to the model.
      prompt_template: |
        The Iris dataset has 150 samples, 4 numeric features and 3 species.
        Summarise the species distribution and suggest one useful check.

  - name: visualize_results
    type: visualization
    depends_on: [analyze_with_cloud_llm]
    params:
      chart_type: metrics
