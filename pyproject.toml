[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autopipe"
version = "0.2.0"
description = "Automatic ML/DL pipeline framework with LLM integration"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Autopipe Team", email = "autopipe@example.com" }
]
keywords = ["ml", "pipeline", "llm", "machine-learning", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "click>=8.0",
    "rich>=13.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
    "tenacity>=8.0",
    "structlog>=23.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-instrumentation>=0.41",
    "prompt-toolkit>=3.0",
    "pygments>=2.16",
    "requests>=2.31",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.11",
    "pytest-xdist>=3.3",
    "pytest-timeout>=2.2",
    "ruff>=0.5",
    "mypy>=1.5",
    "types-PyYAML>=6.0",
    "pre-commit>=3.4",
    "bandit>=1.7",
    "safety>=2.3",
]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.8"]
duckdb = ["duckdb>=0.9"]
torch = [
    "torch>=2.0",
    "torchvision>=0.15",
    "torchaudio>=2.0",
]
tensorflow = [
    "tensorflow>=2.13",
]
ml = [
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
]
 explainability = [
    "shap>=0.42",
    "lime>=0.2",
]
 optuna = [
    "optuna>=3.4",
]
mlflow = [
    "mlflow>=2.9",
]
experiment_tracking = [
    "wandb>=0.16",
    "tensorboard>=2.14",
]
all = [
    "autopipe[dev,openai,anthropic,duckdb,torch,tensorflow,ml,explainability,optuna,mlflow,experiment_tracking]"
]

[project.scripts]
autopipe = "autopipe.cli:main"
autopipe-repl = "autopipe.repl:main"

[project.urls]
Homepage = "https://github.com/autopipe/autopipe"
Documentation = "https://autopipe.readthedocs.io"
Repository = "https://github.com/autopipe/autopipe"
"Bug Tracker" = "https://github.com/autopipe/autopipe/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["autopipe*"]
exclude = ["tests*", "docs*", "autopipe.tests*"]

[tool.setuptools.package-data]
autopipe = ["py.typed", "schemas/*.json"]

# Ruff configuration (ruff is the single linter AND formatter — black/isort removed)
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "N",   # pep8-naming
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PIE", # flake8-pie
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",  # Line too long (enforced by ruff-format)
    "UP015", # Redundant open modes
    # -- Deliberate conventions -------------------------------------------------
    "N803",  # ML convention: lowercase-incompatible arg names (X, X_train, y)
    "N806",  # Same, for local variables
    "B027",  # Step.visualize() is an intentional optional hook, not an error
    "ARG001", "ARG002",  # Unused args are part of the Step.run(**kwargs) contract
    # -- Ratchet: temporarily ignored, re-enable in P1/P2 passes ----------------
    # TODO(P2): re-enable now that requires-python is >=3.10 (run ruff check --fix --unsafe-fixes)
    "UP006", "UP035", "UP045", "UP036",
    # TODO(P1): fix implicit-Optionals during the typing-truth pass
    "RUF013",
    # TODO(P1): add `from e` chains during the exception-hierarchy pass
    "B904",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection defaults are immutable calls, not bugs
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
    "fastapi.File", "fastapi.Form", "fastapi.Header", "fastapi.Cookie",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
"test_*.py" = ["ARG001", "RUF012"]
# Examples bootstrap sys.path before importing the local package (E402 is
# structural there, not sloppiness).
"examples/*.py" = ["E402"]

# mypy configuration
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
show_traceback = false

# CI enforces strict typing on autopipe/core (the engine). Errors inside
# imported non-core modules are silenced so the gate is meaningful now and
# its scope can grow file-by-file (see ROADMAP P2).
follow_imports = "silent"
namespace_packages = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas.*", "sklearn.*", "scipy.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "requires_llm: marks tests that require LLM API calls",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

# Coverage configuration
[tool.coverage.run]
command_line = "-m pytest"
source = ["autopipe"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "autopipe/_version.py",
]

[tool.coverage.report]
precision = 2
fail_under = 80
show_missing = true
skip_covered = false
sort = "Cover"
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abstractstaticmethod",
    "@abstractclassmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# Bandit configuration
[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B311"]

# Coverage for pytest
# Version management
[tool.bumpversion]
current_version = "0.2.0"
commit = true
tag = true
tag_name = "v{new_version}"

# bump-my-version TOML schema: each managed file is a [[files]] array entry.
# (The previous [tool.bumpversion.file.whitelist] table was not a valid
# schema for any release tool — bumps would silently change nothing.)
[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "autopipe/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""
