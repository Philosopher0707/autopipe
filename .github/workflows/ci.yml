name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: ruff check autopipe tests

    - name: Check formatting with ruff-format
      run: ruff format --check autopipe tests

    # Strict typing is ENFORCED on the engine (autopipe/core). Scope grows
    # file-by-file per ROADMAP P2; do not widen to `mypy autopipe` until
    # those modules pass strict.
    - name: Run type checking with mypy (strict, core engine)
      run: mypy autopipe/core

    - name: Run security checks with bandit
      run: bandit -c pyproject.toml -r autopipe

    - name: Run unit tests with coverage
      run: pytest tests/unit -v --cov=autopipe --cov-report=xml --cov-report=html

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  integration:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run integration tests
      run: pytest tests/integration -v --timeout=300
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  backend:
    name: dashboard backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: autopipe/dashboard/backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: autopipe/dashboard/backend/requirements.txt

    - name: Install dependencies
      run: |
        python -m venv .venv_ci
        .venv_ci/bin/python -m pip install --upgrade pip
        .venv_ci/bin/python -m pip install -r requirements.txt

    - name: Run backend tests
      run: .venv_ci/bin/python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: autopipe/dashboard/frontend

    steps:
    - uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
        cache-dependency-path: autopipe/dashboard/frontend/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint
      run: pnpm lint

    - name: Type check
      run: pnpm typecheck

    - name: Run tests
      run: pnpm test

    - name: Build
      run: pnpm build

  build:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: pip install build

    - name: Build package
      run: python -m build

    - name: Check package metadata
      run: |
        pip install twine
        twine check dist/*

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
